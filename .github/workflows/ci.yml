# This workflow will install dependencies, check for dependency version consistency, build all packages in the repo, and run tests
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: iTwin Viewer monorepo CI

on:
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - run: |
          set -e
          echo 'Installing...'
          node common/scripts/install-run-rush.js install

          echo 'Checking Rush Change...'
          node common/scripts/install-run-rush.js change -v

          # echo 'Verifying Dependency Versions...'
          # node common/scripts/install-run-rush.js check

          echo 'Building...'
          node common/scripts/install-run-rush.js rebuild

          echo 'Linting...'
          node common/scripts/install-run-rush.js lint

          echo 'Testing...'
          node common/scripts/install-run-rush.js test --verbose

          echo 'Auditing...'
          node common/scripts/install-run-rush.js audit

  # The modules develop against React 19 and allow React 18 as a peer.
  # This job builds and tests them against React 18.
  react18-compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js 22.x
        uses: actions/setup-node@v1
        with:
          node-version: 22.x
      - run: |
          set -e
          echo 'Pinning React 18...'
          node common/scripts/set-react-version.js apply

          echo 'Updating...'
          node common/scripts/install-run-rush.js update

          echo 'Building...'
          node common/scripts/install-run-rush.js rebuild

          echo 'Checking installed React version...'
          node common/scripts/set-react-version.js verify

          echo 'Testing...'
          node common/scripts/install-run-rush.js test --verbose
